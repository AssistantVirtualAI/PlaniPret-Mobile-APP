apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.planipret.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.planipret.mobile"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate
             // the asset_pack_config.json and other Capacitor files
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Keystore de signature pour la soumission Google Play (Phase 4.3 du plan)
            // Créer le keystore avec la commande :
            //   keytool -genkey -v -keystore planipret-release.keystore -alias planipret \
            //     -keyalg RSA -keysize 2048 -validity 10000 \
            //     -dname "CN=Planipret, OU=Mobile, O=Planipret Inc, L=Montreal, ST=QC, C=CA"
            // Puis définir dans ~/.gradle/gradle.properties :
            //   PLANIPRET_KEYSTORE_FILE=/chemin/vers/planipret-release.keystore
            //   PLANIPRET_KEYSTORE_PASSWORD=votre_mot_de_passe
            //   PLANIPRET_KEY_ALIAS=planipret
            //   PLANIPRET_KEY_PASSWORD=votre_mot_de_passe
            if (project.hasProperty('PLANIPRET_KEYSTORE_FILE')) {
                storeFile file(PLANIPRET_KEYSTORE_FILE)
                storePassword PLANIPRET_KEYSTORE_PASSWORD
                keyAlias PLANIPRET_KEY_ALIAS
                keyPassword PLANIPRET_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            // ── Recommandation Google Play #5 : R8 optimization ──────────────
            // minifyEnabled=true active R8 (shrink + obfuscate + optimize).
            // shrinkResources=true supprime les ressources inutilisées du .aab.
            // proguard-android-optimize.txt (vs proguard-android.txt) active
            // les optimisations avancées de R8 (inlining, dead-code removal).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('PLANIPRET_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "androidx.fragment:fragment:$androidxFragmentVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // androidx.core requis pour WindowCompat.setDecorFitsSystemWindows() (edge-to-edge)
    implementation "androidx.core:core:$androidxCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
